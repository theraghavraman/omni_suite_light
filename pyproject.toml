[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-converter-studio"
version = "0.1.0"
description = "Python SDK and local-engine interface for OmniConverter Studio."
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Raghav Raman" }]
keywords = ["omni", "omni-suite", "converter", "data-engineering", "etl", "data-conversion", "data-profiling", "local-engine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Data Engineers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://theraghavraman.github.io/omni_suite_light/"
Repository = "https://github.com/theraghavraman/omni_suite_light"
Issues = "https://github.com/theraghavraman/omni_suite_light/issues"

[project.optional-dependencies]
data = [
  "pandas>=2.2", "pyarrow>=17", "duckdb>=1.1", "PyYAML>=6.0", "sqlglot>=25",
  "openpyxl>=3.1", "xlrd>=2.0", "pyxlsb>=1.0", "odfpy>=1.4", "tables>=3.10",
  "lxml>=5.3", "fastavro>=1.9", "pymongo>=4.8", "msgpack>=1.0", "tabulate>=0.9",
  "pyreadstat>=1.2", "numpy>=1.26", "xarray>=2024.10", "cftime>=1.6",
  "netCDF4>=1.7", "h5py>=3.11", "h5netcdf>=1.3", "astropy>=6.1",
  "cdflib>=1.3", "cfgrib>=0.9.15", "eccodes>=2.38", "Pillow>=10.4"
]
extended = [
  "fastparquet>=2024.11", "polars>=1.20", "scipy>=1.14", "sympy>=1.13",
  "SQLAlchemy>=2.0", "psycopg[binary]>=3.2", "mysql-connector-python>=9.0",
  "oracledb>=2.5", "pyodbc>=5.2", "py7zr>=0.22", "rarfile>=4.2",
  "imageio>=2.36", "pydub>=0.25", "moviepy>=2.1", "duckdb-engine>=0.15",
  "snowflake-sqlalchemy>=1.6", "google-cloud-bigquery>=3.30",
  "databricks-sql-connector>=3.7", "trino>=0.334", "clickhouse-sqlalchemy>=0.3",
  "sqlalchemy-redshift>=0.8", "cassandra-driver>=3.29", "redis>=5.2",
  "neo4j>=5.28", "boto3>=1.35", "fsspec>=2024.10", "s3fs>=2024.10",
  "gcsfs>=2024.10", "charset-normalizer>=3.4"
]
full = [
  "pandas>=2.2", "pyarrow>=17", "duckdb>=1.1", "PyYAML>=6.0", "sqlglot>=25",
  "openpyxl>=3.1", "xlrd>=2.0", "pyxlsb>=1.0", "odfpy>=1.4", "tables>=3.10",
  "lxml>=5.3", "fastavro>=1.9", "pymongo>=4.8", "msgpack>=1.0", "tabulate>=0.9",
  "pyreadstat>=1.2", "numpy>=1.26", "xarray>=2024.10", "cftime>=1.6",
  "netCDF4>=1.7", "h5py>=3.11", "h5netcdf>=1.3", "astropy>=6.1",
  "cdflib>=1.3", "cfgrib>=0.9.15", "eccodes>=2.38", "Pillow>=10.4",
  "fastparquet>=2024.11", "polars>=1.20", "scipy>=1.14", "sympy>=1.13",
  "SQLAlchemy>=2.0", "psycopg[binary]>=3.2", "mysql-connector-python>=9.0",
  "oracledb>=2.5", "pyodbc>=5.2", "py7zr>=0.22", "rarfile>=4.2",
  "imageio>=2.36", "pydub>=0.25", "moviepy>=2.1", "duckdb-engine>=0.15",
  "snowflake-sqlalchemy>=1.6", "google-cloud-bigquery>=3.30",
  "databricks-sql-connector>=3.7", "trino>=0.334", "clickhouse-sqlalchemy>=0.3",
  "sqlalchemy-redshift>=0.8", "cassandra-driver>=3.29", "redis>=5.2",
  "neo4j>=5.28", "boto3>=1.35", "fsspec>=2024.10", "s3fs>=2024.10",
  "gcsfs>=2024.10", "charset-normalizer>=3.4"
]

[project.scripts]
omni-engine = "omni_sdk.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["omni_data_engine", "omni_platform", "omni_local_server"]

[tool.setuptools.packages.find]
include = ["omni_sdk*"]
