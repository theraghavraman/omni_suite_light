services:
  - type: web
    name: omni-cloud-engine
    runtime: docker
    dockerfilePath: ./omni-cloud-engine/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: MAX_JOBS
        value: "25"
      - key: RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: OMNI_CLOUD_TOKEN
        sync: false
      - key: CLOUD_ALLOWED_ORIGINS
        value: "https://theraghavraman.github.io"
