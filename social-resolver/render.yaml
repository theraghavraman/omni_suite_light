services:
  - type: web
    name: omni-social-resolver
    runtime: docker
    plan: free
    rootDir: social-resolver
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://theraghavraman.github.io
      - key: MAX_DURATION
        value: "900"
      - key: MAX_DOWNLOAD_MB
        value: "300"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      # Optional: set a value to require X-Omni-Social-Token on /api/resolve, then paste the
      # same value into window.OMNI_SOCIAL_RESOLVER_TOKEN in social_resolver_config.js.
      - key: SOCIAL_TOKEN
        sync: false
