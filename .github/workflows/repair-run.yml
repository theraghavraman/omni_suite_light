name: Repair malformed EPUB template
on: push
permissions:
  contents: write
jobs:
  repair:
    if: ${{ hashFiles('index.html') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.find('<script id="omni-platform-ui">',280000)
          end=s.find("</script>",start) if start>=0 else -1
          if start<0 or end<0:
              print("No malformed embedded block found; nothing to repair.")
          else:
              p.write_text(s[:start]+s[end+len("</script>"):],encoding="utf-8")
              print("Removed malformed embedded platform script.")
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert s.count('<script id="omni-platform-ui">') == 0
          print("Verified.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/repair-epub-html.yml .github/workflows/repair-run.yml repair-trigger.txt
          git commit -m "Fix EPUB template script contamination"
          git push
