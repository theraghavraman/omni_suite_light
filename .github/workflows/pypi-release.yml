name: Publish OmniConverter Studio to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/omni-wheel-test
          /tmp/omni-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/omni-wheel-test/bin/python -c "import omni_sdk; print(omni_sdk.__version__)"
          /tmp/omni-wheel-test/bin/omni-engine version
      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-converter-studio-distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omni-converter-studio
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: omni-converter-studio-distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
