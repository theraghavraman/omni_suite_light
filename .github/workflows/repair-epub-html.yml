name: One-shot HTML repair

on:
  push:
    paths:
      - ".github/workflows/repair-epub-html.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicated platform script from EPUB template
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          start = s.find('<script id="omni-platform-ui">', 280000)
          if start < 0:
              raise SystemExit("Embedded platform script marker not found")
          end = s.find("</script>", start)
          if end < 0:
              raise SystemExit("Embedded platform script closing tag not found")
          s = s[:start] + s[end + len("</script>"):]
          p.write_text(s, encoding="utf-8")
          print("Removed embedded platform script block from EPUB chapter template.")

      - name: Verify HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          assert s.count('<script id="omni-platform-ui">') == 0
          assert s.count('zip.file(`OEBPS/page_\${i}.xhtml`, chapterHtml);') == 1
          assert s.endswith("</html>\n") or s.endswith("</html>")
          print("HTML contamination check passed.")
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/repair-epub-html.yml
          git commit -m "Fix EPUB HTML script contamination"
          git push
