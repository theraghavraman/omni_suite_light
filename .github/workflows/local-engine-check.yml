name: Validate OmniConverter

on:
  push:
  pull_request:

jobs:
  python-package:
    name: Python package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Install into a clean venv (outside the checkout) and smoke-test the CLI
        run: |
          python -m venv /tmp/omni-venv
          /tmp/omni-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/omni-venv/bin/omni-engine version
          /tmp/omni-venv/bin/omni-engine doctor > /dev/null
          /tmp/omni-venv/bin/python -c "import omni_local_server, omni_sdk; print('imports ok')"
  native-smoke:
    name: Native smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate Python bridge syntax
        run: python -m py_compile omni_environment.py omni_local_server.py omni_data_engine.py omni_platform.py omni_code_runner.py prepare_offline.py verify_local_environment.py omni_bootstrap.py omni_security_primitives.py omni-cloud-engine/app.py omni-cloud-engine/omni_security_primitives.py social-resolver/app.py social-resolver/omni_security_primitives.py
      - name: Validate shared environment inventory
        run: python .github/scripts/environment_inventory_test.py
      - name: Run Omni contract audit
        run: python .github/scripts/omni_contract_audit.py
      - name: Run security regression tests
        run: |
          python -m unittest discover -s tests -v
          python .github/scripts/local_engine_security_test.py
          node tests/test_security_browser.cjs
      - name: Validate Universal Data JavaScript syntax
        run: node --check universal_data_studio.js
      - name: Validate Office Tools, Diagram Forge and cloud bridge syntax
        run: |
          node --check omni_vendor_loader.js
          node --check office_tools_studio.js
          node --check diagram_forge_studio.js
          node --check office_find_replace.js
          node --check photo_editor.js
          node --check omni_language_studio.js
          node --check file_sharing_studio.js
          node --check qrcode_generator.js
          node --check omni_browser_ai.js
          node --check omni_browser_ai_ui.js
          node --check omni_browser_media_ai.js
          python -m py_compile omni-cloud-engine/app.py
      - name: Validate RAG Studio JavaScript syntax
        run: node --check rag_studio.js
      - name: Validate browser worker module syntax
        shell: bash
        run: node --input-type=module --check < omni_browser_media_ai_worker.js
      - name: Validate Studio wiring
        run: node .github/scripts/studio_wiring_check.mjs
      - name: Validate assistant retrieval regression
        run: node .github/scripts/assistant_rag_regression.mjs
      - name: Install native dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg qpdf poppler-utils imagemagick librsvg2-bin libheif-dev libeccodes-dev tesseract-ocr libreoffice calibre pandoc
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey downloads occasionally fail transiently; retry the whole set before giving up.
          $pkgs = "ffmpeg","qpdf","poppler","imagemagick","tesseract","libreoffice","calibre","pandoc"
          for ($i = 1; $i -le 3; $i++) {
            choco install @pkgs -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install attempt $i failed (exit $LASTEXITCODE); retrying in 30s"
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install python@3.13 ffmpeg qpdf poppler imagemagick libheif ghostscript eccodes tesseract pandoc p7zip sevenzip
          brew install --cask libreoffice calibre
      - name: Refresh PATH after native package install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $machine = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          $extra = @(
            "C:\Program Files\LibreOffice\program",
            "C:\Program Files\Calibre2",
            "C:\Program Files\Tesseract-OCR"
          ) | Where-Object { Test-Path $_ }
          "PATH=$machine;$user;$($extra -join ';');$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          $extra | ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }
      - name: Verify native executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($exe in @("ffmpeg","qpdf","pdftoppm","pdftotext","tesseract","soffice","ebook-convert","node")) {
            $cmd = Get-Command $exe -ErrorAction Stop
            Write-Host "$exe -> $($cmd.Source)"
          }
          if (Get-Command magick -ErrorAction SilentlyContinue) {
            Write-Host "magick -> $((Get-Command magick).Source)"
          } else {
            $cmd = Get-Command convert -ErrorAction Stop
            Write-Host "convert -> $($cmd.Source)"
          }

      - name: Install Python runtime used by native smoke test
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-local.txt

      - name: Run representative native smoke test
        if: runner.os == 'Linux'
        run: python .github/scripts/native_smoke_test.py

      - name: Run cloud and social fail-closed runtime checks
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/cloud-social-env"
          "$RUNNER_TEMP/cloud-social-env/bin/python" -m pip install \
            -r omni-cloud-engine/requirements.txt \
            -r social-resolver/requirements.txt
          "$RUNNER_TEMP/cloud-social-env/bin/python" .github/scripts/cloud_social_security_test.py

      - name: Run dependency audit
        if: runner.os == 'Linux'
        run: |
          python -m pip install pip-audit
          pip-audit -r omni-cloud-engine/requirements.txt -r social-resolver/requirements.txt
          # instagrapi is installed with --no-deps (its Pillow<13 cap blocks the CVE fix),
          # so build the resolver environment exactly as its Dockerfile does and audit
          # what is actually installed, instagrapi included.
          python -m venv "$RUNNER_TEMP/resolver-env"
          "$RUNNER_TEMP/resolver-env/bin/python" -m pip install -r social-resolver/requirements.txt
          "$RUNNER_TEMP/resolver-env/bin/python" -m pip install --no-deps -r social-resolver/requirements-instagrapi.txt
          pip-audit --path "$("$RUNNER_TEMP/resolver-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      - name: Verify native executables (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          for exe in ffmpeg qpdf pdftoppm pdftotext tesseract soffice ebook-convert node; do
            command -v "$exe"
          done
          if command -v magick >/dev/null 2>&1; then command -v magick; else command -v convert; fi
          python - <<'PY'
          import subprocess
          for cmd in (["ffmpeg", "-version"], ["qpdf", "--version"]):
              subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30, check=True)
          PY


