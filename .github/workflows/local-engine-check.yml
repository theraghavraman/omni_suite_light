name: Validate OmniConverter

on:
  push:
  pull_request:

jobs:
  native-smoke:
    name: Native smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Validate Python bridge syntax
        run: python -m py_compile omni_local_server.py prepare_offline.py
      - name: Install native dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg qpdf poppler-utils imagemagick tesseract-ocr libreoffice calibre
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg qpdf poppler imagemagick tesseract libreoffice calibre -y --no-progress
      - name: Verify native executables
        shell: bash
        run: |
          ffmpeg -version
          qpdf --version
          pdftoppm -v
          pdftotext -v
          (magick -version || convert -version)
          tesseract --version
          soffice --version
          ebook-convert --version
      - name: Refresh PATH after native package install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $machine = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          "PATH=$machine;$user;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Run native 11-item smoke test
        env:
          OMNI_TEST_ORIGIN: http://127.0.0.1:8765
        run: python .github/scripts/native_smoke_test.py
      - name: Validate setup files
        shell: bash
        run: |
          test -s install_system_tools.command
          test -s install_windows.ps1
          test -s start_omni.bat
          test -s start_omni.command
          test -s setup_and_start.bat
          test -s setup_and_start.command
