name: Validate OmniConverter

on:
  push:
  pull_request:

jobs:
  native-smoke:
    name: Native smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-local.txt
      - name: Validate Python bridge syntax
        run: python -m py_compile omni_local_server.py omni_data_engine.py omni_platform.py prepare_offline.py verify_local_environment.py omni_bootstrap.py
      - name: Validate Universal Data JavaScript syntax
        run: node --check universal_data_studio.js
      - name: Install native dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg qpdf poppler-utils imagemagick libheif-dev libeccodes-dev tesseract-ocr libreoffice calibre pandoc
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg qpdf poppler imagemagick tesseract libreoffice calibre pandoc -y --no-progress
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install python@3.13 ffmpeg qpdf poppler imagemagick libheif ghostscript eccodes tesseract pandoc p7zip sevenzip
          brew install --cask libreoffice calibre
      - name: Refresh PATH after native package install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $machine = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          $extra = @(
            "C:\Program Files\LibreOffice\program",
            "C:\Program Files\Calibre2",
            "C:\Program Files\Tesseract-OCR"
          ) | Where-Object { Test-Path $_ }
          "PATH=$machine;$user;$($extra -join ';');$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          $extra | ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }
      - name: Verify native executables
        shell: bash
        run: |
          set -e
          command -v ffmpeg
          command -v qpdf
          command -v pdftoppm
          command -v pdftotext
          command -v tesseract
          command -v soffice
          command -v ebook-convert
          command -v node
          if command -v magick >/dev/null 2>&1; then command -v magick; else command -v convert; fi
          timeout 30s ffmpeg -version >/dev/null
          timeout 30s qpdf --version >/dev/null
          timeout 30s pdftoppm -v >/dev/null 2>&1 || true
          timeout 30s tesseract --version >/dev/null
          timeout 30s soffice --version >/dev/null
          timeout 30s ebook-convert --version >/dev/null
          timeout 30s node --version >/dev/null
      - name: Refresh PATH after native package install (macOS)
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install COMPLETE Local Engine Python stack
        run: python -m pip install -r requirements-local.txt
      - name: Prepare offline browser assets
        run: python prepare_offline.py
      - name: Run strict Local Engine environment verification
        run: python verify_local_environment.py
      - name: Run suite-wide contract audit
        run: python .github/scripts/omni_contract_audit.py
      - name: Run expanded native format smoke test
        env:
          OMNI_TEST_ORIGIN: http://127.0.0.1:8765
        run: python .github/scripts/native_smoke_test.py
      - name: Validate setup files
        shell: bash
        run: |
          test -s install_system_tools.command
          test -s install_windows.ps1
          test -s start_omni.bat
          test -s start_omni.command
          test -s setup_and_start.bat
          test -s setup_and_start.command
