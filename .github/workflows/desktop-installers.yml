name: Build OmniConverter Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop-installer:
    name: Build Desktop Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install native tools & Packaging Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot rpm ffmpeg qpdf poppler-utils imagemagick librsvg2-bin tesseract-ocr libreoffice calibre pandoc p7zip-full

      - name: Install native tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgs = "ffmpeg","qpdf","poppler","imagemagick","tesseract","libreoffice","calibre","pandoc","7zip"
          for ($i = 1; $i -le 3; $i++) {
            choco install @pkgs -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install native tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg qpdf poppler imagemagick ghostscript tesseract pandoc sevenzip
          brew install --cask libreoffice calibre

      - name: Stage desktop bundle (offline vendor assets + Python runtime + native tools)
        run: |
          python scripts/stage_desktop_bundle.py --download-offline --create-venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            build/python-runtime/Scripts/python.exe -m pip install -r requirements-local.txt
          else
            build/python-runtime/bin/python3 -m pip install -r requirements-local.txt
          fi

      - name: Run desktop & security verification suite
        run: |
          python -m unittest discover -s tests -v
          python .github/scripts/omni_contract_audit.py
          python .github/scripts/environment_inventory_test.py
          python .github/scripts/local_engine_security_test.py
          node tests/test_security_browser.cjs
          node .github/scripts/studio_wiring_check.mjs

      - name: Install Electron Forge dependencies & build OS installer
        run: |
          npm install
          npx electron-forge make
